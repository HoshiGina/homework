<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/style.css" />
    <title>Ваши личные данные</title>
  </head>
  <body>
    <form>
      <fieldset>

        <legend>Ваши личные данные</legend>

        <label>
          Ваше имя
          <input type="text" placeholder="Имя" name="name" required/>
        </label>

        <label>
          Ваш возраст
          <input type="number" placeholder="Возраст" name="age" inputmode="numeric" required/>
        </label>

        <label>
          Ваш номер телефона
          <input type="tel" placeholder="Номер" inputmode="tel" name="phone" required/>
        </label>

        <label>
          Ваша почта
          <input type="email" placeholder="Почта" inputmode="email" name="email" required />
        </label>

        <label>
            Сообщение
          <textarea placeholder="Ваше сообщение" name="messag" required></textarea>
        </label>label>
            
          <label>
           <input type="checkbox" name="agreement"   id="chek" required />
             Я принимаю правила
        </label>

        <label>
        <button type="submit">Отправить</button>
        </label>

      </fieldset>
  </body>
</html
