          <input type="text" placeholder="Имя" name="name" required/>

          <input type="tel" placeholder="Номер" inputmode="tel" name="phone" required/>
        </label>

        <label>
          Ваша почта
          <input type="email" placeholder="Почта" inputmode="email" name="email" required />
        </label>

        <label>
            Сообщение
          <textarea placeholder="Ваше сообщение" name="messeg" required></textarea>

           <input type="checkbox" name="я принимаю соглашение" value="" id="chek" required />
             Я принимаю правила
          
        </label>
        <button>Отправить</button>
        <label>

      </fieldset>
      
</label>
